# Deploy to /etc/fail2ban/filter.d/caddy-inky-login.conf
#
# Matches failed (401) POST attempts against /api/auth/login in Caddy's JSON
# access log (see Caddyfile). Verified against a synthetic Caddy log line with
# `fail2ban-regex` — correctly ignores successful logins (status 200) and 401s
# on other endpoints.
#
# Deliberately scoped to /api/auth/login only: the password-reset and account
# activation endpoints use 256-bit random tokens, not guessable secrets, so
# they aren't meaningful brute-force targets.

[Definition]
datepattern = "ts":{EPOCH}
failregex = ^\{.*"request":\{"remote_ip":"<HOST>".*"uri":"/api/auth/login".*\},.*"status":401.*\}$
ignoreregex =

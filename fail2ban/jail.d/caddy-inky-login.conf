# Deploy to /etc/fail2ban/jail.d/caddy-inky-login.conf
#
# 5 failed logins from one IP within 10 minutes -> 1 hour ban.
# Loose enough that a family member fumbling their password won't lock
# themselves out, tight enough to stop scripted credential stuffing.

[caddy-inky-login]
enabled  = true
port     = http,https
filter   = caddy-inky-login
logpath  = /var/log/caddy/inky-gallery-access.log
backend  = auto
maxretry = 5
findtime = 10m
bantime  = 1h

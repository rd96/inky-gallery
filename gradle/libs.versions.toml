[versions]
http4k = "6.55.0.0"
jackson = "2.22.1"
result4k = "2.25.6.0"
exposed = "1.3.1"
postgres="42.7.13"
hikari="7.1.0"
argon2="2.12"
flyway="12.10.0"
mockk="1.14.11"
junit="6.1.1"

[libraries]
http4k-bom = { module = "org.http4k:http4k-bom", version.ref = "http4k" }
http4k-core = { module = "org.http4k:http4k-core" }
http4k-config = { module = "org.http4k:http4k-config" }
http4k-client-apache = { module = "org.http4k:http4k-client-apache" }
http4k-server-apache = { module = "org.http4k:http4k-server-apache" }
http4k-format-jackson = { module = "org.http4k:http4k-format-jackson" }

jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

result4k = { module = "dev.forkhandles:result4k", version.ref = "result4k" }

exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-migration-jdbc = { module = "org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }

postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }

hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway"}

argon2 = { module = "de.mkammerer:argon2-jvm", version.ref = "argon2" }

# testing
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }

[bundles]
http4k = [
    "http4k-core",
    "http4k-config",
    "http4k-client-apache",
    "http4k-server-apache",
    "http4k-format-jackson",
]
exposed = [
    "exposed-core",
    "exposed-jdbc",
    "exposed-migration-jdbc",
    "exposed-kotlin-datetime",
]
flyway = [
    "flyway-core",
    "flyway-postgres",
]